# 手动触发的按钮，出现在「代码 → 分支详情页」。
# 按钮里的 event 必须在 .cnb.yml 中有同名事件，否则点了没反应。
branch:
  # 反向同步只对 main 有意义：pipeline 里固定拉 GitHub 的 main。
  - reg: ^main$
    buttons:
      - name: 立即从 GitHub 同步
        description: 拉取 GitHub 的代码、tag 与 Release
        event: web_trigger_sync_from_github
        groupName: GitHub 同步
        permissions:
          roles:
            - owner
            - master
            - developer

  - buttons:
      - name: 推送到 GitHub 并创建 PR
        description: 把 CNB 分支推送到 GitHub 的 cnb/ 分支并发起 PR
        event: web_trigger_pr_to_github
        groupName: GitHub 同步
        permissions:
          roles:
            - owner
            - master
            - developer
        inputs:
          source_branch:
            name: 源分支（CNB）
            type: input
            placeholder: 留空使用当前分支
          base_branch:
            name: 目标分支（GitHub）
            type: input
            default: main
          pr_title:
            name: PR 标题
            type: input
            placeholder: 留空自动生成
