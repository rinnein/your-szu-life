name: Build packages

# 只作为可复用 workflow 被 build.yml / pr-build.yml 调用，自身不订阅任何事件。
# 这里只负责造包并上传 artifact，不碰 release、tag、AUR。
on:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            bundles: deb appimage
            platform: linux
            arch: x64
          - name: windows-x64
            os: windows-latest
            bundles: msi
            platform: windows
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            aria2 \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            wget

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Build desktop bundles
        run: vpr tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Normalize desktop bundle names
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          output_dir="release-packages"
          mkdir -p "$output_dir"
          shopt -s nullglob
          if [[ '${{ matrix.platform }}' == 'linux' ]]; then
            files=(
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
            )
          else
            files=(
              src-tauri/target/release/bundle/msi/*.msi
            )
          fi
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            extension="${file##*.}"
            cp "$file" "$output_dir/your-szu-life_${{ matrix.platform }}_${{ matrix.arch }}_${version}-release.${extension}"
          done

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: release-packages/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      # build.rs 用 NDK 自带的 ld.lld 把 aria2c 侧车二进制打包成 APK 内的
      # lib/<abi>/libaria2c.so（Tauri CLI 不为 Android 处理 externalBin）。
      # 这里显式导出 NDK 路径，让构建脚本稳定找到工具链。
      - name: Export Android NDK path
        shell: bash
        run: |
          ndk_dir="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ndk_dir"
          {
            echo "ANDROID_NDK_HOME=$ndk_dir"
            echo "ANDROID_NDK_ROOT=$ndk_dir"
            echo "NDK_HOME=$ndk_dir"
          } >> "$GITHUB_ENV"

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Configure fixed Android signing
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          android_dir="src-tauri/gen/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$android_dir/ci-release.keystore"
          cat > "$android_dir/keystore.properties" <<EOF
          storeFile=ci-release.keystore
          keyAlias=$ANDROID_KEY_ALIAS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure temporary Android signing
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          android_dir="src-tauri/gen/android"
          keytool -genkeypair -v \
            -keystore "$android_dir/ci-ephemeral.keystore" \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=your-szu-life CI"
          cat > "$android_dir/keystore.properties" <<'EOF'
          storeFile=ci-ephemeral.keystore
          keyAlias=ci
          storePassword=changeit
          keyPassword=changeit
          EOF

      - name: Build Android APK
        # The release artifact is ARM64. Explicitly limit Tauri/Gradle to the
        # target that is built so the generated project does not require the
        # default armv7/x86 libraries that are intentionally not compiled.
        run: vpr tauri android build --ci --apk --target aarch64 --split-per-abi

      - name: Verify Android signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Normalize Android APK name
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          mkdir -p release-packages
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          cp "$apk" "release-packages/your-szu-life_android_arm64_${version}-release.apk"
          gzip -9 -c "$apk" > "release-packages/your-szu-life_android_arm64_${version}-release.apk.gz"

      - name: Upload Android packages
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: release-packages/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f src-tauri/gen/android/ci-*.keystore src-tauri/gen/android/keystore.properties
