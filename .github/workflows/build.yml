name: Build and publish packages

# 两条发布通道，共用同一套构建产物：
#   - push 到 main（或手动 workflow_dispatch）→ 刷新滚动 canary 预发布
#   - push 版本 tag（v*）→ 发布正式 release（latest），并把同一次构建的资产
#     同步到 canary，让测试版频道与 AUR 立刻拿到这个版本
# 两种入口都会派发 AUR（只消费 canary tag）并回调 CNB 同步。
# PR 的构建在 pr-build.yml 里，那个 workflow 没有任何发布 job。
# push 只放宽到 main 与 v* tag：CNB 同步过来的 cnb/* 分支也是 push 事件，
# 不限制的话推一次分支就会跑整套构建并覆盖 canary release。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    # 构建步骤与 PR 构建共用，见 build-packages.yml。这里的入口都是可信事件
    # （main push / 版本 tag / 手动触发），所以直接用仓库正式签名。
    permissions:
      contents: read
    uses: ./.github/workflows/build-packages.yml
    with:
      signing: repo
    secrets: inherit

  publish:
    name: Publish release
    needs: [packages]
    # 发布代码在 .ci/publish-github-release.mjs：同样的「先删旧资产再上传」
    # 覆盖语义，稳定版与 canary 只是参数不同。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download this run's packages
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Publish stable release
        # 正式版的身份就是推上来的 tag；版本号、资产名以 package.json 为准。
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.packages.outputs.version }}
          TITLE: v${{ needs.packages.outputs.version }}
          PRERELEASE: 'false'
          MAKE_LATEST: 'true'
          TARGET_COMMITISH: ${{ github.sha }}
          ASSET_DIR: packages
        run: node .ci/publish-github-release.mjs

      - name: Publish canary release
        # 滚动 tag 指向本次构建的提交，旧资产全部替换，只保留本次的产物。
        # tag push 时这里也让测试版频道与 AUR 直接拿到同一个版本。
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: canary
          VERSION: ${{ needs.packages.outputs.version }}
          TITLE: canary v${{ needs.packages.outputs.version }}
          PRERELEASE: 'true'
          MAKE_LATEST: 'false'
          GENERATE_NOTES: 'false'
          MOVE_TAG: 'true'
          TARGET_COMMITISH: ${{ github.sha }}
          ASSET_DIR: packages
        run: node .ci/publish-github-release.mjs

  # 发布完成后拉起 rinnein/auto-aur，只重建由 canary release 供养的子包
  # your-szu-life-bin。AUR 代表 canary 频道的更新频率，不为正式版另外分包。
  #
  # 跨仓库权限靠一个 GitHub App 换取临时的 installation token：
  #   - 变量 APP_CLIENT_ID：App 的 Client ID
  #   - secret APP_PRIVATE_KEY：App 的私钥
  #   - 该 App 需要安装到 rinnein/auto-aur 上，并授予 Contents: write
  #     （repository_dispatch 归在 Contents 权限下；只给 Actions: write
  #     会在调用 dispatches 时返回 403 Resource not accessible by integration）
  # token 只在本次 job 内有效（1 小时后过期，job 结束即被吊销），不再需要
  # 长期 PAT。任一凭据缺失时跳过派发，不影响 release 本身的发布。
  aur:
    name: Publish to AUR
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check AUR trigger credentials
        id: credentials
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 APP_CLIENT_ID / APP_PRIVATE_KEY，跳过 AUR 发布"
          fi

      - name: Generate a token
        id: app-token
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: auto-aur
          # 只申请派发 workflow 所需的权限，token 才真正是最小权限。
          # POST /repos/{owner}/{repo}/dispatches 校验的是 Contents: write，
          # 不是 Actions: write——后者只能重跑/取消 workflow run。
          permission-contents: write

      - name: Dispatch auto-aur for your-szu-life-bin
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE: ${{ github.repository }}
          TAG: canary
        run: |
          set -euo pipefail
          # tasks 只放「这个 release 供哪些子包」的知识，别的一概不交给
          # payload；即使 payload 被改写，auto-aur 也只会接受 conf.json 里
          # 已启用的任务。
          # --fail-with-body 让 4xx/5xx 仍然退出非零，但把 GitHub 的错误
          # JSON 打进日志——只看 "curl: (22) 403" 无法判断是权限还是参数问题。
          tasks='["your-szu-life-bin"]'
          jq -n \
            --arg source "$SOURCE" \
            --arg tag "$TAG" \
            --argjson tasks "$tasks" \
            '{event_type: "aur-release",
              client_payload: {source: $source, tag: $tag,
                               tasks: $tasks, force: false}}' \
          | curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d @- \
              "https://api.github.com/repos/rinnein/auto-aur/dispatches"
          echo "dispatched AUR publish for $SOURCE@$TAG ($tasks)"

  # 发布结束后，主动让 CNB 拉一次（CNB 侧事件 api_trigger_github_sync，
  # 定义在 .cnb.yml，跑的是和每日定时任务同一段 pipeline：拉代码/tag + 镜像
  # Release）。pipeline 里的 push_tags 会把版本 tag 一并拉到 CNB，正式版与
  # canary 都会被镜像；失败不影响已经发出去的 release。
  sync-cnb:
    name: Trigger CNB sync
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CNB github-to-cnb pipeline
        env:
          CNB_TOKEN: ${{ secrets.CNB_SYNC_TOKEN }}
          CNB_REPO: rinnein/szu/your-szu-life
        run: |
          set -euo pipefail
          if [ -z "$CNB_TOKEN" ]; then
            echo "::notice::未配置 CNB_SYNC_TOKEN，跳过 CNB 同步"
            exit 0
          fi
          # sync 不开：CNB 那边自己有 1 小时的 lock，异步拉取即可，不占本 job 时间。
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            -H "Content-Type: application/json" \
            -d '{"event":"api_trigger_github_sync","branch":"main"}' \
            "https://api.cnb.cool/$CNB_REPO/-/build/start"
          echo