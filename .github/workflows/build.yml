name: Build and publish packages

# 两条发布通道，共用同一套构建产物：
#   - push 到 main（或手动 workflow_dispatch）→ 刷新滚动 canary 预发布
#   - push 版本 tag（v*）→ 发布正式 release（latest），并把同一次构建的资产
#     同步到 canary，让测试版频道与 AUR 立刻拿到这个版本
# 两种入口都会派发 AUR（只消费 canary tag）并回调 CNB 同步。
#
# tag 与 canary 的去重：同一提交先随 main push 构建发布过 canary，之后再补推
# 版本 tag 时整套构建是重复劳动。detect job 用「canary tag 指向本次提交 +
# canary release 资产齐全」判定已构建过：此时跳过 packages 构建，publish 直接
# 下载 canary 资产发正式版，并跳过 canary 重发与 AUR 派发（AUR 由 canary 渠道
# 供养，main push 那次已经派发过）；任何一项不满足则回退完整构建。
# PR 的构建在 pr-build.yml 里，那个 workflow 没有任何发布 job。
# push 只放宽到 main 与 v* tag：CNB 同步过来的 cnb/* 分支也是 push 事件，
# 不限制的话推一次分支就会跑整套构建并覆盖 canary release。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Resolve version & reuse check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      reuse: ${{ steps.reuse.outputs.reuse }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1.22.0

      - name: Read version from package.json
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(vp node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          if [ -z "$version" ]; then
            echo "::error::package.json 缺少 version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Detect whether this commit was already published as canary
        id: reuse
        # 非 tag push 一律走完整构建；tag push 只有在 canary tag 指向同一提交、
        # 且 canary release 已带上全部对应版本资产时才复用。
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$VERSION" ]; then
            echo "::notice::tag $GITHUB_REF_NAME 与 package.json 版本 $VERSION 不一致；发布名与资产名以 package.json 为准"
          fi
          # ls-remote 会把附注 tag 的对象 sha 与剥离后的 commit sha 都列出来
          # （^{ } 后缀是 peeled 引用），取最后一行保证拿到的是 commit。
          canary_sha="$(git ls-remote origin 'refs/tags/canary' 'refs/tags/canary^{}' | awk '{print $1}' | tail -1)"
          if [ -z "$canary_sha" ]; then
            echo "::notice::canary tag 不存在，走完整构建"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$canary_sha" != "$GITHUB_SHA" ]; then
            echo "::notice::canary tag 指向 $canary_sha，不等于本次 tag 的提交 $GITHUB_SHA，走完整构建"
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expected=(
            "your-szu-life_linux_x64_${VERSION}-release.deb"
            "your-szu-life_linux_x64_${VERSION}-release.AppImage"
            "your-szu-life_windows_x64_${VERSION}-release.msi"
            "your-szu-life_android_arm64_${VERSION}-release.apk"
            "your-szu-life_android_arm64_${VERSION}-release.apk.gz"
          )
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/canary" --jq '.assets[].name' 2>/dev/null || true)"
          reuse=true
          for name in "${expected[@]}"; do
            if ! grep -qxF -- "$name" <<<"$assets"; then
              echo "::notice::canary release 缺少资产 $name，走完整构建"
              reuse=false
            fi
          done
          if [ "$reuse" = "true" ]; then
            echo "::notice::tag $GITHUB_REF_NAME 指向的提交已随 canary 构建发布，跳过构建并复用其资产"
          fi
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"

  packages:
    # 构建步骤与 PR 构建共用，见 build-packages.yml。这里的入口都是可信事件
    # （main push / 版本 tag / 手动触发），所以直接用仓库正式签名。
    # 复用 canary 资产时整个构建被跳过，publish 改从 canary release 取资产。
    needs: [detect]
    if: needs.detect.outputs.reuse != 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-packages.yml
    with:
      signing: repo
    secrets: inherit

  publish:
    name: Publish release
    needs: [detect, packages]
    # packages 被跳过（复用 canary 资产）时也要继续发布，否则正式版发不出去。
    if: >-
      ${{
        !cancelled() &&
        needs.detect.result == 'success' &&
        (needs.packages.result == 'success' || needs.packages.result == 'skipped')
      }}
    # 发布代码在 .ci/publish-github-release.mjs：同样的「先删旧资产再上传」
    # 覆盖语义，稳定版与 canary 只是参数不同。
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Check out repository
        # 全量历史与 tag：正式版要按「上一个版本 tag → 当前 tag」生成 release notes。
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up vp
        uses: voidzero-dev/setup-vp@v1.22.0

      - name: Download this run's packages
        if: needs.detect.outputs.reuse != 'true'
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Reuse canary assets
        # 同一提交已随 canary 发布：直接从 canary release 下载资产充当本次的
        # 待发布产物，后面两个发布步骤按正常流程走。资产名带 package.json
        # 版本号，与 detect 的检查一致，旧的残留版本不会混进来。
        #
        # glob 的版本前缀必须是 `_`：资产名是
        # your-szu-life_<platform>_<arch>_<version>-release.<ext>，版本号紧跟在
        # 下划线之后。写成 `*-${VERSION}-release.*` 会一个都匹配不到（gh 只会
        # 报 "no assets match the file pattern"）。
        if: needs.detect.outputs.reuse == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packages
          gh release download canary --repo "$GITHUB_REPOSITORY" \
            --pattern "*_${VERSION}-release.*" --dir packages --clobber
          test "$(find packages -type f | wc -l)" -ge 5
          ls -l packages

      - name: Generate stable release notes
        # changelogen（unjs/changelogen）按 tag 差异输出 commit 概要；找不到上一个
        # 版本 tag（首个发布）就不产出文件，发布时走 generate-notes 回退。
        # 失败不阻断发布：BODY_FILE 缺失时 .ci/publish-github-release.mjs 会回退。
        if: github.ref_type == 'tag'
        continue-on-error: true
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev_tag="$(git tag --sort=-v:refname | grep -E '^v[0-9]' | awk -v t="$TAG" 'found{print; exit} $0==t{found=1}')"
          if [ -z "$prev_tag" ]; then
            echo "::notice::找不到 $TAG 之前的版本 tag，跳过 changelogen，发布时回退 generate-notes"
            exit 0
          fi
          echo "生成 $prev_tag..$TAG 的 commit 概要"
          vpx changelogen@latest --dir "$GITHUB_WORKSPACE" \
            --from "$prev_tag" --to "$TAG" --noAuthors \
            --output "$GITHUB_WORKSPACE/release-notes.md"
          # 文件输出会带一行「# Changelog」大标题，release 正文里是噪音，去掉。
          sed -i '1{/^# Changelog$/d}' "$GITHUB_WORKSPACE/release-notes.md"

      - name: Publish stable release
        # 正式版的身份就是推上来的 tag；版本号、资产名以 package.json 为准。
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.detect.outputs.version }}
          TITLE: v${{ needs.detect.outputs.version }}
          PRERELEASE: 'false'
          MAKE_LATEST: 'true'
          TARGET_COMMITISH: ${{ github.sha }}
          BODY_FILE: release-notes.md
          ASSET_DIR: packages
        run: vpx .ci/publish-github-release.mjs

      - name: Publish canary release
        # 滚动 tag 指向本次构建的提交，旧资产全部替换，只保留本次的产物。
        # tag push 时这里也让测试版频道与 AUR 直接拿到同一个版本；复用 canary
        # 资产时 canary 已经就是这份内容，重发一遍纯属多余，跳过。
        if: github.ref_type != 'tag' || needs.detect.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: canary
          VERSION: ${{ needs.detect.outputs.version }}
          TITLE: canary v${{ needs.detect.outputs.version }}
          PRERELEASE: 'true'
          MAKE_LATEST: 'false'
          GENERATE_NOTES: 'false'
          MOVE_TAG: 'true'
          TARGET_COMMITISH: ${{ github.sha }}
          ASSET_DIR: packages
        run: vpx .ci/publish-github-release.mjs

  # 发布完成后拉起 rinnein/auto-aur，只重建由 canary release 供养的子包
  # your-szu-life-bin。AUR 代表 canary 频道的更新频率，不为正式版另外分包。
  #
  # 跨仓库权限靠一个 GitHub App 换取临时的 installation token：
  #   - 变量 APP_CLIENT_ID：App 的 Client ID
  #   - secret APP_PRIVATE_KEY：App 的私钥
  #   - 该 App 需要安装到 rinnein/auto-aur 上，并授予 Contents: write
  #     （repository_dispatch 归在 Contents 权限下；只给 Actions: write
  #     会在调用 dispatches 时返回 403 Resource not accessible by integration）
  # token 只在本次 job 内有效（1 小时后过期，job 结束即被吊销），不再需要
  # 长期 PAT。任一凭据缺失时跳过派发，不影响 release 本身的发布。
  aur:
    name: Publish to AUR
    needs: [publish, detect]
    # AUR 的 your-szu-life-bin 只吃 canary：复用 canary 资产的 tag push 里，
    # canary 渠道在 main push 那次已经发布并派发过 AUR，这里再派发是重复劳动。
    if: >-
      ${{
        !cancelled() &&
        needs.publish.result == 'success' &&
        !(github.ref_type == 'tag' && needs.detect.outputs.reuse == 'true')
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check AUR trigger credentials
        id: credentials
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 APP_CLIENT_ID / APP_PRIVATE_KEY，跳过 AUR 发布"
          fi

      - name: Generate a token
        id: app-token
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: auto-aur
          # 只申请派发 workflow 所需的权限，token 才真正是最小权限。
          # POST /repos/{owner}/{repo}/dispatches 校验的是 Contents: write，
          # 不是 Actions: write——后者只能重跑/取消 workflow run。
          permission-contents: write

      - name: Dispatch auto-aur for your-szu-life-bin
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE: ${{ github.repository }}
          TAG: canary
        run: |
          set -euo pipefail
          # tasks 只放「这个 release 供哪些子包」的知识，别的一概不交给
          # payload；即使 payload 被改写，auto-aur 也只会接受 conf.json 里
          # 已启用的任务。
          # --fail-with-body 让 4xx/5xx 仍然退出非零，但把 GitHub 的错误
          # JSON 打进日志——只看 "curl: (22) 403" 无法判断是权限还是参数问题。
          tasks='["your-szu-life-bin"]'
          jq -n \
            --arg source "$SOURCE" \
            --arg tag "$TAG" \
            --argjson tasks "$tasks" \
            '{event_type: "aur-release",
              client_payload: {source: $source, tag: $tag,
                               tasks: $tasks, force: false}}' \
          | curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d @- \
              "https://api.github.com/repos/rinnein/auto-aur/dispatches"
          echo "dispatched AUR publish for $SOURCE@$TAG ($tasks)"

  # 发布结束后，主动让 CNB 拉一次（CNB 侧事件 api_trigger_github_sync，
  # 定义在 .cnb.yml，跑的是和每日定时任务同一段 pipeline：拉代码/tag + 镜像
  # Release）。pipeline 里的 push_tags 会把版本 tag 一并拉到 CNB，正式版与
  # canary 都会被镜像；失败不影响已经发出去的 release。
  sync-cnb:
    name: Trigger CNB sync
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CNB github-to-cnb pipeline
        env:
          CNB_TOKEN: ${{ secrets.CNB_SYNC_TOKEN }}
          CNB_REPO: rinnein/szu/your-szu-life
        run: |
          set -euo pipefail
          if [ -z "$CNB_TOKEN" ]; then
            echo "::notice::未配置 CNB_SYNC_TOKEN，跳过 CNB 同步"
            exit 0
          fi
          # sync 不开：CNB 那边自己有 1 小时的 lock，异步拉取即可，不占本 job 时间。
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $CNB_TOKEN" \
            -H "Accept: application/vnd.cnb.api+json" \
            -H "Content-Type: application/json" \
            -d '{"event":"api_trigger_github_sync","branch":"main"}' \
            "https://api.cnb.cool/$CNB_REPO/-/build/start"
          echo