name: Build packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            bundles: deb appimage
            paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: windows-x64
            os: windows-latest
            # WiX 3.14's MSI database defaults to code page 1252 and cannot
            # bundle the Chinese productName ("泥深"). NSIS handles the same
            # name correctly; keep the Windows artifact build reliable until
            # a UTF-8 WiX locale is supplied.
            bundles: nsis
            paths: |
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
          run-install: false

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ matrix.name }}-node-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-node-

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            wget

      - name: Cache verified OCR model
        uses: actions/cache@v4
        with:
          path: src-tauri/target/model-cache
          key: ${{ runner.os }}-ddddocr-${{ hashFiles('src-tauri/resources/ocr/ddddocr/model.json') }}

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Build desktop bundles
        run: vpr tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 14

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "22"
          cache: true
          run-install: false

      - name: Cache Node dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-android-node-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-android-node-

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache verified OCR model
        uses: actions/cache@v4
        with:
          path: src-tauri/target/model-cache
          key: ${{ runner.os }}-ddddocr-${{ hashFiles('src-tauri/resources/ocr/ddddocr/model.json') }}

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Configure fixed Android signing
        if: github.ref == 'refs/heads/master'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          android_dir="src-tauri/gen/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$android_dir/ci-release.keystore"
          cat > "$android_dir/keystore.properties" <<EOF
          storeFile=ci-release.keystore
          keyAlias=$ANDROID_KEY_ALIAS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure temporary Android signing
        if: github.ref != 'refs/heads/master'
        shell: bash
        run: |
          set -euo pipefail
          android_dir="src-tauri/gen/android"
          keytool -genkeypair -v \
            -keystore "$android_dir/ci-ephemeral.keystore" \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=your-szu-life CI"
          cat > "$android_dir/keystore.properties" <<'EOF'
          storeFile=ci-ephemeral.keystore
          keyAlias=ci
          storePassword=changeit
          keyPassword=changeit
          EOF

      - name: Build Android APK and AAB
        # The release artifact is ARM64. Explicitly limit Tauri/Gradle to the
        # target that is built so the generated project does not require the
        # default armv7/x86 libraries that are intentionally not compiled.
        run: vpr tauri android build --ci --apk --aab --target aarch64 --split-per-abi

      - name: Verify Android signatures
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -print -quit)"
          aab="$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          # AABs are signed with the configured release key (or an ephemeral
          # CI key). jarsigner may report a self-signed certificate as an
          # untrusted chain, so verify the JAR signature without requiring
          # the certificate to chain to the runner's trust store.
          jarsigner -verify "$aab"

      - name: Upload Android packages
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f src-tauri/gen/android/ci-*.keystore
          src-tauri/gen/android/keystore.properties

  aur-source:
    name: aur-source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Upload AUR PKGBUILD
        uses: actions/upload-artifact@v7
        with:
          name: aur-source
          path: PKGBUILD
          if-no-files-found: error
          retention-days: 14

  canary:
    name: Publish canary prerelease
    needs: [desktop, android, aur-source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: canary-release
      cancel-in-progress: false
    steps:
      - name: Download this run's packages
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Replace canary release assets
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const repo = context.repo;
            const tag = 'canary';
            const root = path.resolve('packages');
            const files = [];
            async function collect(dir) {
              for (const entry of await fs.readdir(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) await collect(file);
                else if (entry.isFile()) files.push(file);
              }
            }
            await collect(root);
            if (!files.length) throw new Error('No packages downloaded');
            // Include artifact/subdirectory names to avoid platform filename collisions.
            const assets = files.sort().map(file => ({
              file,
              name: path.relative(root, file).split(path.sep).join('--'),
            }));
            if (new Set(assets.map(asset => asset.name)).size !== assets.length) {
              throw new Error('Duplicate release asset names');
            }
            const metadata = {
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: 'canary',
              body: `自动构建预发布。\n\n提交：${context.sha}\n构建：${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`,
              draft: false,
              prerelease: true,
              make_latest: 'false',
            };
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release) {
              const previousAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                ...repo, release_id: release.id, per_page: 100,
              });
              for (const asset of previousAssets) {
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
              }
            }
            // Keep the rolling tag on the commit that produced these packages.
            try {
              await github.rest.git.updateRef({
                ...repo, ref: `tags/${tag}`, sha: context.sha, force: true,
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({
                ...repo, ref: `refs/tags/${tag}`, sha: context.sha,
              });
            }
            ({ data: release } = release
              ? await github.rest.repos.updateRelease({ ...metadata, release_id: release.id })
              : await github.rest.repos.createRelease(metadata));
            for (const asset of assets) {
              await github.rest.repos.uploadReleaseAsset({
                ...repo,
                release_id: release.id,
                name: asset.name,
                data: await fs.readFile(asset.file),
              });
            }
            core.info(`Uploaded ${assets.length} assets to ${release.html_url}`);
