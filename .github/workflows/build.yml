name: Build packages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            bundles: deb appimage
            platform: linux
            arch: x64
          - name: windows-x64
            os: windows-latest
            bundles: msi
            platform: windows
            arch: x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.name }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.name }}-cargo-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            aria2 \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            wget

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Build desktop bundles
        run: vpr tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Normalize desktop bundle names
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          output_dir="release-packages"
          mkdir -p "$output_dir"
          shopt -s nullglob
          if [[ '${{ matrix.platform }}' == 'linux' ]]; then
            files=(
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
            )
          else
            files=(
              src-tauri/target/release/bundle/msi/*.msi
            )
          fi
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            extension="${file##*.}"
            cp "$file" "$output_dir/your-szu-life_${{ matrix.platform }}_${{ matrix.arch }}_${version}-release.${extension}"
          done

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: release-packages/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          cache: true
          run-install: false

      - name: Cache Rust build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-android-cargo-

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      # build.rs 用 NDK 自带的 ld.lld 把 aria2c 侧车二进制打包成 APK 内的
      # lib/<abi>/libaria2c.so（Tauri CLI 不为 Android 处理 externalBin）。
      # 这里显式导出 NDK 路径，让构建脚本稳定找到工具链。
      - name: Export Android NDK path
        shell: bash
        run: |
          ndk_dir="$ANDROID_HOME/ndk/27.0.12077973"
          test -d "$ndk_dir"
          {
            echo "ANDROID_NDK_HOME=$ndk_dir"
            echo "ANDROID_NDK_ROOT=$ndk_dir"
            echo "NDK_HOME=$ndk_dir"
          } >> "$GITHUB_ENV"

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: vp install --frozen-lockfile

      - name: Configure fixed Android signing
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          android_dir="src-tauri/gen/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$android_dir/ci-release.keystore"
          cat > "$android_dir/keystore.properties" <<EOF
          storeFile=ci-release.keystore
          keyAlias=$ANDROID_KEY_ALIAS
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Configure temporary Android signing
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          android_dir="src-tauri/gen/android"
          keytool -genkeypair -v \
            -keystore "$android_dir/ci-ephemeral.keystore" \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=your-szu-life CI"
          cat > "$android_dir/keystore.properties" <<'EOF'
          storeFile=ci-ephemeral.keystore
          keyAlias=ci
          storePassword=changeit
          keyPassword=changeit
          EOF

      - name: Build Android APK
        # The release artifact is ARM64. Explicitly limit Tauri/Gradle to the
        # target that is built so the generated project does not require the
        # default armv7/x86 libraries that are intentionally not compiled.
        run: vpr tauri android build --ci --apk --target aarch64 --split-per-abi

      - name: Verify Android signatures
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Normalize Android APK name
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")"
          mkdir -p release-packages
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print0)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          cp "$apk" "release-packages/your-szu-life_android_arm64_${version}-release.apk"
          gzip -9 -c "$apk" > "release-packages/your-szu-life_android_arm64_${version}-release.apk.gz"

      - name: Upload Android packages
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: release-packages/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f src-tauri/gen/android/ci-*.keystore src-tauri/gen/android/keystore.properties

  canary:
    name: Publish canary prerelease
    needs: [ desktop, android ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: canary-release
      cancel-in-progress: false
    steps:
      - name: Download this run's packages
        uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Replace canary release assets
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const repo = context.repo;
            const tag = 'canary';
            const root = path.resolve('packages');
            const files = [];
            async function collect(dir) {
              for (const entry of await fs.readdir(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) await collect(file);
                else if (entry.isFile()) files.push(file);
              }
            }
            await collect(root);
            if (!files.length) throw new Error('No packages downloaded');
            // Each build job has already assigned a unique release filename.
            const assets = files.sort().map(file => ({
              file,
              name: path.basename(file),
            }));
            if (new Set(assets.map(asset => asset.name)).size !== assets.length) {
              throw new Error('Duplicate release asset names');
            }
            const versionMatch = assets
              .map(asset => asset.name.match(/_(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)-release\./))
              .find(Boolean);
            const releaseVersion = versionMatch ? versionMatch[1] : '';
            const metadata = {
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: releaseVersion ? `canary v${releaseVersion}` : 'canary',
              body: `自动构建预发布。\n\n${releaseVersion ? `版本：${releaseVersion}\n` : ''}提交：${context.sha}\n构建：${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`,
              draft: false,
              prerelease: true,
              make_latest: 'false',
            };
            let release;
            try {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ ...repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release) {
              const previousAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
                ...repo, release_id: release.id, per_page: 100,
              });
              for (const asset of previousAssets) {
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
              }
            }
            // Keep the rolling tag on the commit that produced these packages.
            try {
              await github.rest.git.updateRef({
                ...repo, ref: `tags/${tag}`, sha: context.sha, force: true,
              });
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) throw error;
              await github.rest.git.createRef({
                ...repo, ref: `refs/tags/${tag}`, sha: context.sha,
              });
            }
            ({ data: release } = release
              ? await github.rest.repos.updateRelease({ ...metadata, release_id: release.id })
              : await github.rest.repos.createRelease(metadata));
            for (const asset of assets) {
              await github.rest.repos.uploadReleaseAsset({
                ...repo,
                release_id: release.id,
                name: asset.name,
                data: await fs.readFile(asset.file),
              });
            }
            // Remove any stale assets that survived the replacement, keeping
            // only the files produced by this workflow run.
            const currentNames = new Set(assets.map(asset => asset.name));
            const remainingAssets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...repo, release_id: release.id, per_page: 100,
            });
            for (const asset of remainingAssets) {
              if (!currentNames.has(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: asset.id });
              }
            }
            core.info(`Uploaded ${assets.length} assets to ${release.html_url}`);

  # 发布完成后拉起 rinnein/auto-aur，只重建由 canary release 供养的子包
  # your-szu-life-bin。
  #
  # 跨仓库权限靠一个 GitHub App 换取临时的 installation token：
  #   - 变量 APP_CLIENT_ID：App 的 Client ID
  #   - secret APP_PRIVATE_KEY：App 的私钥
  #   - 该 App 需要安装到 rinnein/auto-aur 上，并授予 Contents: write
  #     （repository_dispatch 归在 Contents 权限下；只给 Actions: write
  #     会在调用 dispatches 时返回 403 Resource not accessible by integration）
  # token 只在本次 job 内有效（1 小时后过期，job 结束即被吊销），不再需要
  # 长期 PAT。任一凭据缺失时跳过派发，不影响 release 本身的发布。
  aur:
    name: Publish to AUR
    needs: [ canary ]
    # 只让 main 的构建去动 AUR：本 workflow 是 on: push（无分支过滤），
    # 其它分支的构建不该改写 AUR 上的正式包。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check AUR trigger credentials
        id: credentials
        env:
          APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 APP_CLIENT_ID / APP_PRIVATE_KEY，跳过 AUR 发布"
          fi

      - name: Generate a token
        id: app-token
        if: steps.credentials.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: auto-aur
          # 只申请派发 workflow 所需的权限，token 才真正是最小权限。
          # POST /repos/{owner}/{repo}/dispatches 校验的是 Contents: write，
          # 不是 Actions: write——后者只能重跑/取消 workflow run。
          permission-contents: write

      - name: Dispatch auto-aur for your-szu-life-bin
        if: steps.credentials.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE: ${{ github.repository }}
          TAG: canary
        run: |
          set -euo pipefail
          # tasks 只放「这个 release 供哪些子包」的知识，别的一概不交给
          # payload；即使 payload 被改写，auto-aur 也只会接受 conf.json 里
          # 已启用的任务。
          # --fail-with-body 让 4xx/5xx 仍然退出非零，但把 GitHub 的错误
          # JSON 打进日志——只看 "curl: (22) 403" 无法判断是权限还是参数问题。
          tasks='["your-szu-life-bin"]'
          jq -n \
            --arg source "$SOURCE" \
            --arg tag "$TAG" \
            --argjson tasks "$tasks" \
            '{event_type: "aur-release",
              client_payload: {source: $source, tag: $tag,
                               tasks: $tasks, force: false}}' \
          | curl -sS --fail-with-body -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d @- \
              "https://api.github.com/repos/rinnein/auto-aur/dispatches"
          echo "dispatched AUR publish for $SOURCE@$TAG ($tasks)"
