name: Build PR packages

# PR 只有「reviewer approve」这一个构建入口：这里不订阅 pull_request，
# 所以开 PR、往 PR 推新提交都不会产生 run。
#
# 批准只回答「是否允许构建」；是否使用仓库正式签名是第二个问题，approval 之后
# 在 PR 里问 owner，只认固定命令（prod-sign:y/y 或 prod-sign:n/n，独占一行），
# 60 秒内未回复按一次性签名处理。决策脚本固定取自目标分支，PR 改不到它。
# 本文件里没有任何发布 job，PR 构建不可能动 release、tag 或 AUR。
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: pr-packages-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  decide-signing:
    # submitted 覆盖 approve / changes_requested / comment 三种提交，只放行 approve。
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      signing: ${{ steps.decide.outputs.signing }}
    steps:
      - name: Check out the trusted base branch
        uses: actions/checkout@v7
        with:
          # 决策脚本必须来自目标分支（通常是 main），绝不能执行 PR 里的版本，
          # 否则 PR 可以篡改判定逻辑把自己提升成「使用正式签名」。
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: .ci

      - name: Ask the owner and wait for prod-sign
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .ci/pr-signing-decision.mjs

  packages:
    needs: decide-signing
    # 同一个构建定义。正式 keystore 只在 owner 回复 y 时注入；其余情况传空串，
    # 构建内按 inputs.signing 走一次性签名。PR 构建仍然拿不到 APTABASE_APP_KEY。
    permissions:
      contents: read
    uses: ./.github/workflows/build-packages.yml
    with:
      signing: ${{ needs.decide-signing.outputs.signing }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ needs.decide-signing.outputs.signing == 'repo' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEY_ALIAS: ${{ needs.decide-signing.outputs.signing == 'repo' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ needs.decide-signing.outputs.signing == 'repo' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_PASSWORD: ${{ needs.decide-signing.outputs.signing == 'repo' && secrets.ANDROID_KEY_PASSWORD || '' }}