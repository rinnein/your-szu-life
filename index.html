<!doctype html>
<html lang="zh-CN" data-theme="szu">
  <head>
    <script>
      // 在首帧前确定深浅色，避免默认浅色闪一下再切深色。
      // 与 src/theme/ThemeProvider.tsx 的 applyDocumentTheme 保持一致。
      (function () {
        var root = document.documentElement;
        var mode = "light";
        try {
          var saved = localStorage.getItem("szu.appearance-mode");
          if (saved === "dark" || saved === "light") mode = saved;
          else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
            mode = "dark";
        } catch (error) {
          if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches)
            mode = "dark";
        }
        root.dataset.theme = "szu";
        root.dataset.themeMode = mode;
        root.style.colorScheme = mode;
      })();
    </script>
    <script type="importmap">
      {
        "imports": {
          "modern-monaco/editor-core": "/vendor/modern-monaco/editor-core.mjs",
          "modern-monaco/lsp": "/vendor/modern-monaco/lsp/index.mjs"
        }
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <!--
      兜底防线，不是 Android 的主修复：Chrome/WebView 从无障碍角度会忽略这里的
      user-scalable=no，安卓侧靠 MobileViewport.kt 的 setSupportZoom(false) 关手势。
      这条 meta 负责 iOS WKWebView 与桌面触控板缩放，并向这些环境声明本应用不希望缩放。
      viewport-fit=cover 与边到边沉浸式一致，不影响已有的 insets 逻辑。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
