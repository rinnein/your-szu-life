[package]
name = "your-szu-life"
# 应用版本以 package.json 为准（tauri.conf.json 的 version 指向它）；这里只继承
# workspace 版本，并由 build.rs 在构建期校验两者一致。
version.workspace = true
description = "泥深 - 你的SZU助手"
authors = ["you"]
edition = "2021"

[lib]
name = "your_szu_life_lib"
# staticlib 只给 iOS/iPadOS 用，本仓库没有该目标；保留它会让每次构建额外
# 归档一个约 600MB 的 `.a`。Android 用 cdylib，桌面的 main.rs 用 rlib。
crate-type = ["cdylib", "rlib"]

# workspace 根就是 `src-tauri`，app 包本身是根 package。
# 这样 `Cargo.lock` 仍在 `src-tauri/Cargo.lock`（`gen/android/app/build.gradle.kts`
# 读 `../../Cargo.lock` 取 rustls-platform-verifier 版本）、`target/` 仍在
# `src-tauri/target`（`gen/android/buildSrc` 的 `BuildTask.kt` 按
# `rootDirRel = "../../../"` 找 `libyour_szu_life_lib.so`），Android 与 CI 的
# 路径全部不需要改。
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.18.4"
edition = "2021"
authors = ["you"]

# 所有成员 crate 共用同一份依赖声明，避免版本与 feature 漂移。
# 平台条件仍写在各 crate 自己的 `[target.'cfg(...)'.dependencies]` 里。
[workspace.dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
# 匿名统计。与项目 reqwest 的 rustls 后端保持一致，避免额外引入 native-tls。
tauri-plugin-aptabase = { version = "1.3.0", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", features = ["clock"] }
image = "0.25"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
log = "0.4"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
  "cookies",
  "form",
  "query",
  # SOCKS5 代理仅在打开该 feature 时才被 reqwest 接受（见 netproxy）。
  "socks",
] }
http = "1"
sha1 = "0.11"
hmac = "0.13"
md-5 = "0.11"
base64 = "0.23"
argon2 = "0.6"
rand = "0.10"
chacha20poly1305 = "0.11"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
cookie_store = "0.22"
reqwest_cookie_store = "0.10"
mp4 = "0.14"
m3u8-rs = "6"
scraper = "0.29.0"
ddddocr-core = "=0.2.4"
ddddocr-tract2 = "=0.2.4"
sha2 = "0.11"
flate2 = "1.0"
calamine = "0.38.0"
toasty = { version = "0.11", features = ["sqlite", "serde", "migration"] }
imageproc = { version = "0.27", default-features = false }
des = "0.9"
regex = "1"
base16384 = "0.1.0"
rig-core = "0.47.0"
rig-agent = "0.47.0"
rig-reqwest = "0.47.0"
rig-rmcp = "0.47.0"
agent-client-protocol = "5.5"
rmcp = { version = "3", default-features = false, features = [
  "macros",
  "server",
  "schemars",
  "transport-streamable-http-server",
  "transport-io",
] }
schemars = { version = "1.0", features = ["derive"] }
axum = "0.8"
futures-util = "0.3"
netdev = "0.48"
# 设备自组网：进程内链接 EasyTier 核心，no-tun 模式不创建 TUN 设备、不依赖
# Android VpnService；对等设备之间的 TCP 走 `ffi-dataplane` 的用户态数据面。
# 固定在 2.7.1 的 tag 上，升级时需要重新核对 `mesh` 模块用到的 API。
easytier = { git = "https://github.com/EasyTier/EasyTier", rev = "0d9c52b169dc2112687ddefcf571cd01d383193c", default-features = false, features = [
  "management-rpc",
  "ffi-dataplane",
  "aes-gcm",
  "websocket",
  # 多协议监听器/连接器：与 websocket 一样是 instance composition 的协议 adapter
  # feature，缺了对应的监听器 URL 会在能力校验时直接报错。
  "quic",
  # 刻意不开 `faketcp`：它是唯一拉起 `pnet_datalink` 的 feature，而后者在 Windows
  # 上 `#[link(name = "Packet")]`，会让 exe 静态依赖 WinPcap/Npcap 的 packet.dll
  # （没装驱动的机器上是「缺少 packet.dll」，编译期则是缺 Packet.lib）。faketcp 在
  # Windows 还必须借 Npcap 内核驱动才能发包，收益远不及这个强依赖；tcp/udp/ws/quic
  # 已覆盖公共中继的全部用途。
  # 组网配置使用 dhcp = true 由虚拟网分配地址；不打开该 feature 时
  # EasyTier 会在创建实例时报「this build does not include DHCP IPv4」。
  "dhcp-ipv4",
  "dhcp-ipv6",
  # no_tun 模式下 EasyTier 会启动内置 packet proxy；缺这个 feature 时创建实例
  # 会报「this build does not include packet proxy services」。
  "icmp-proxy",
  # 节点发现协议：TXT / SRV（dns-resolver）与 HTTP(S) endpoint 发现。默认 STUN
  # 服务器是 `txt:stun*.easytier.cn` 形式，缺这个 feature 时解析会失败并刷日志。
  "endpoint-discovery",
] }
# 数据面类型（DataPlaneTcpStream/Listener）与 ConfigFileControl 只在这里导出。
easytier-core = { git = "https://github.com/EasyTier/EasyTier", rev = "0d9c52b169dc2112687ddefcf571cd01d383193c", default-features = false, features = [
  "management-rpc",
  "proxy-smoltcp-stack",
  "aes-gcm",
] }
# EasyTier 只用 `tracing` 记录日志，本应用其余部分用 `log`。显式打开 tracing 的
# `log` feature：在没有 tracing subscriber 时事件会转发给 `log`，因此 EasyTier 的
# 日志与其它日志一样遵守调试页的保留级别和 target 过滤。不要依赖 tower/axum
# 偶然带上的同名 feature。
tracing = { version = "0.1", features = ["log"] }
# keyring 4 起改用 keyring-core 的凭据库架构：`v1` feature 保留原来的
# `Entry::{new,get_secret,set_secret,delete_credential}` 用法（macOS 钥匙串 /
# Windows 凭据管理器 / *nix Secret Service），旧的 linux-native、windows-native
# 等 feature 已不存在。
keyring = { version = "4", features = ["v1"] }
ssid = "0.1"
# 桌面端文件夹选择器走系统原生实现（Linux 使用 xdg-desktop-portal）；Android 由 SAF 桥负责。
tauri-plugin-dialog = "2"
android-native-keyring-store = "1.0.0"
keyring-core = "1.1.0"
# jni 0.21：`android-native-keyring-store` 1.0 依赖 jni ^0.21，应用的 JNI 桥接
# 沿用同一版本；jni 0.22 是绑定层 API 重写（EnvUnowned / jni_str! 等），只在
# rustls-platform-verifier 的类型转换处按独立别名引入。
jni = "0.21"
jni022 = { package = "jni", version = "0.22" }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7"
# 这三个 GTK 绑定必须与 tauri / wry 自身的依赖保持一致（tauri 2.12 仍要求
# gtk ^0.18、webkit2gtk =2.0.2、soup3 ^0.5）：它们用来接收 tauri 传出的
# WebView 指针，版本不一致会在树里出现两套不兼容的 GTK 类型。
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
soup3 = "0.5"
gtk = "0.18"
# 系统代理探测直接在进程内读注册表（netproxy/windows.rs）。起 `reg query`
# 子进程会在 GUI 子系统下闪控制台窗口，因此这里只要注册表 API 的 feature。
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# 开机自启：插件内部按平台写 XDG autostart / 用户 Run 注册表；Linux 下优先读取
# `$APPIMAGE`，AppImage 挂载点变化后重启仍能指向真实镜像。
tauri-plugin-autostart = "2"
wallpaper = "3.2"
tempfile = "3"

[dependencies]
szu-core = { path = "crates/szu-core" }
szu-download = { path = "crates/szu-download" }
szu-runtime = { path = "crates/szu-runtime" }
szu-app-content = { path = "crates/szu-app-content" }
szu-todos = { path = "crates/szu-todos" }
szu-mesh = { path = "crates/szu-mesh" }
szu-enrollment = { path = "crates/szu-enrollment" }
szu-jxxk = { path = "crates/szu-jxxk" }
szu-lms = { path = "crates/szu-lms" }
szu-signin = { path = "crates/szu-signin" }
szu-timetable = { path = "crates/szu-timetable" }
szu-oj = { path = "crates/szu-oj" }
szu-uooc = { path = "crates/szu-uooc" }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-deep-link = { workspace = true }
tauri-plugin-os = { workspace = true }
tauri-plugin-log = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-aptabase = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
rig-core = { workspace = true }
rig-rmcp = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
axum = { workspace = true }
szu-ai = { path = "crates/szu-ai" }

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-dialog = { workspace = true }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-autostart = { workspace = true }

# 托盘左键点击只有 ksni 后端会上报（默认的 libappindicator 后端明确不发
# TrayIconEvent，D-Bus Activate 直接返回 UnknownMethod）。这里直接依赖
# tray-icon 只为把 feature 并进 tauri 内部那一份：两边版本必须一致（tauri
# 2.12 要求 ^0.25），否则会出现两个 tray-icon crate、feature 不会合并，左键
# 又退回被吞掉的状态。ksni 分支优先于 libappindicator，见 tray-icon 的
# platform_impl/mod.rs。
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
tray-icon = { version = "0.25", default-features = false, features = ["ksni", "serde"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
szu-build-support = { path = "crates/szu-build-support" }
reqwest = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { workspace = true }

[profile.release]
# 体积优化，按 Tauri 官方 size 指南（https://tauri.app/concept/size/）。
# 桌面与 Android 都走 release 发布，因此统一在这里配置。
codegen-units = 1
lto = true
opt-level = "s"
# 剥掉符号表：Android 的 cdylib 实测 187MB → 109MB，APK 里的同名 `.so` 同样受益。
# 应用日志不依赖符号（没有 panic hook、也不读 backtrace），只影响原生 crash 的
# tombstone 符号化。
strip = true
# 官方指南还建议 `panic = "abort"`，这里刻意不开：szu-core / szu-download 的
# JNI 桥接与校园网轮询靠 `catch_unwind` 把 panic 降级成错误，abort 会让一次
# panic 直接终止整个应用进程。

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 0

[profile.test.package."*"]
debug = false
