[package]
name = "your-szu-life"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "your_szu_life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }
tauri-plugin-keyring-store = { version = "0.2.0", default-features = false }
tauri-plugin-notification = "2.4.0"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
  "cookies",
] }
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
jni022 = { package = "jni", version = "0.22" }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7"
