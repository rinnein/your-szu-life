[package]
name = "your-szu-life"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

[lib]
name = "your_szu_life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", features = ["clock"] }
image = "0.25"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tauri-plugin-keyring-store = { version = "0.2.0", default-features = false }
tauri-plugin-notification = "2.4.0"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
  "cookies",
  "form",
  "query",
] }
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
cookie_store = "0.22"
reqwest_cookie_store = "0.10"
mp4 = "0.14"
m3u8-rs = "6"
scraper = "0.27.0"
calamine = "0.36.1"
base16384 = "0.1.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["linux-native", "apple-native", "windows-native"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
jni022 = { package = "jni", version = "0.22" }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7"
