[package]
name = "your-szu-life"
version = "0.11.0"
description = "泥深 - 你的SZU助手"
authors = ["you"]
edition = "2021"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = 0

[profile.test.package."*"]
debug = false

[lib]
name = "your_szu_life_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
chrono = { version = "0.4", features = ["clock"] }
image = "0.25"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
rust-ini = "=0.21.1"
log = "0.4"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
  "cookies",
  "form",
  "query",
  # SOCKS5 代理仅在打开该 feature 时才被 reqwest 接受（见 netproxy）。
  "socks",
] }
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
base64 = "0.22"
argon2 = "0.5"
rand = "0.9"
chacha20poly1305 = "0.10.1"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
cookie_store = "0.22"
reqwest_cookie_store = "0.10"
mp4 = "0.14"
m3u8-rs = "6"
scraper = "0.27.0"
ddddocr-core = "=0.2.4"
ddddocr-tract2 = "=0.2.4"
sha2 = "0.10"
flate2 = "1.0"
calamine = "0.36.1"
toasty = { version = "0.11", features = ["sqlite", "serde", "migration"] }
imageproc = { version = "0.26", default-features = false }
des = "0.8"
regex = "1"
base16384 = "0.1.0"
async-openai = { version = "0.42.1", default-features = false, features = [
  "chat-completion",
  "model",
  "rustls",
] }
rig-core = "0.44.0"
rig-agent = "0.44.0"
rig-rmcp = "0.44.0"
rmcp = { version = "2", default-features = false, features = [
  "macros",
  "server",
  "schemars",
  "transport-streamable-http-server",
  "transport-io",
] }
schemars = { version = "1.0", features = ["derive"] }
axum = "0.8"
futures-util = "0.3"
netdev = "0.46"

[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = [
  "linux-native",
  "sync-secret-service",
  "crypto-rust",
  "apple-native",
  "windows-native",
] }
ssid = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.0"
jni = "0.21"
jni022 = { package = "jni", version = "0.22" }
ndk-context = "0.1.1"
rustls-platform-verifier = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_40"] }
soup3 = "0.5"
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_NetworkManagement_WiFi",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
wallpaper = "3.2"

[dev-dependencies]
tempfile = "3"
