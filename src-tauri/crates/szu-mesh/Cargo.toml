[package]
name = "szu-mesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "泥深设备自组网（EasyTier no-tun）与设置同步"

[lib]
name = "szu_mesh"
path = "src/lib.rs"

[dependencies]
szu-core = { path = "../szu-core" }
szu-uooc = { path = "../szu-uooc" }
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
toasty = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
argon2 = { workspace = true }
easytier = { workspace = true }
easytier-core = { workspace = true }
# 这里不 import `tracing`，但必须依赖它来打开 `tracing/log`：EasyTier 只用
# `tracing` 记日志，没有该 feature 时事件不会转发给 `log`，调试页就看不到组网日志。
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

