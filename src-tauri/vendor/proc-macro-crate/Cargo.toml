# 本目录是 proc-macro-crate 2.0.2 的本地副本，只修改下面两处版本约束：
#
#   - 去掉未使用的 `toml_datetime = "=0.6.3"` 精确依赖；
#   - 把 `toml_edit` 放宽成 `0.20.2`（语义不变，仍解析到 0.20 系列）。
#
# 原因：glib-macros 0.18（Linux 上 webkit2gtk 的构建依赖）要求
# `proc-macro-crate ^2.0`，而 2.0.2 用精确版本钉住了 toml_datetime 0.6.3；
# EasyTier 的 rust-i18n-support 又要求 `toml ^0.8.8`（依赖 toml_datetime ^0.6.5）。
# 两者在 0.6.x 上无法共存。proc-macro-crate 本身并不使用 toml_datetime，
# 放宽后即可共存。等上游 glib-macros 升到 proc-macro-crate 3 后可删除本目录与
# Cargo.toml 里的 `[patch.crates-io]`。
